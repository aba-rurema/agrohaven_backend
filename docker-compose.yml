services:
  postgres:
    image: postgres:17
    container_name: agrohaven-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrohaven
      POSTGRES_PASSWORD: agrohaven
      POSTGRES_DB: agrohaven
    ports:
      - '5432:5432'
    volumes:
      - agrohaven_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agrohaven -d agrohaven']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agrohaven_pg:
